name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax
        run: for f in bin/crew lib/*.sh test/*.sh install.sh .github/package.sh .github/site.sh; do sh -n "$f"; done
      - name: ShellCheck
        run: |
          command -v shellcheck >/dev/null || brew install shellcheck
          shellcheck -s sh -S warning -x bin/crew lib/*.sh test/*.sh install.sh .github/package.sh .github/site.sh
      - name: Tests
        run: sh test/run.sh
