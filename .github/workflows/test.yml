name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: for f in bin/crew lib/*.sh test/run.sh; do sh -n "$f"; done
      - name: ShellCheck
        run: |
          command -v shellcheck >/dev/null || brew install shellcheck
          shellcheck -s sh -S warning bin/crew lib/*.sh test/run.sh
      - name: Tests
        run: sh test/run.sh
