name: Bug
description: crew did something other than what it says it does
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A vulnerability goes through the Security tab ("Report a vulnerability"), not here: see SECURITY.md.
  - type: textarea
    id: ran
    attributes:
      label: What you ran
      description: The crew commands, in order, from the start of the crew if you can.
      render: shell
    validations:
      required: true
  - type: textarea
    id: printed
    attributes:
      label: What crew printed
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: screen
    attributes:
      label: The pane, for a prompt the gate misread
      description: "`crew peek <name> 40` while the prompt is on screen."
      render: text
  - type: input
    id: version
    attributes:
      label: crew version
      description: "`crew version`"
    validations:
      required: true
  - type: dropdown
    id: terminal
    attributes:
      label: Terminal
      options:
        - iTerm2
        - tmux
        - tmux inside iTerm2
    validations:
      required: true
  - type: input
    id: agents
    attributes:
      label: Agents and their versions
      placeholder: "Claude Code 2.x, Codex 0.x, Antigravity 1.x"
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "macOS 26.1, Ubuntu 24.04"
